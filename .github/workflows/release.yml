name: Release Multi-Platform Desktop Pet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cpu: arm64
            arch: Apple-Silicon
          - runner: macos-13
            cpu: x86_64
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python3 -m pip install 'pyinstaller==6.22.3' 'Pillow>=10,<13'
      - name: Test source and architecture
        run: |
          test "$(uname -m)" = "${{ matrix.cpu }}"
          python3 -m unittest discover -s tests -q
      - name: Build BooBoo.app & MooKrata
        run: sh scripts/build_macos.sh
      - name: Test bundled app
        timeout-minutes: 3
        run: |
          test -x dist/BooBoo.app/Contents/MacOS/BooBoo
          dist/BooBoo.app/Contents/MacOS/BooBoo --smoke-test
          codesign --verify --deep --strict dist/BooBoo.app
      - name: Package Mac download
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/BooBoo.app "CuteDesktopPet-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "CuteDesktopPet-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CuteDesktopPet-macOS-${{ matrix.arch }}
          path: CuteDesktopPet-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Build Windows Executables
        run: cmd.exe /c scripts\build_windows.bat
      - name: Smoke test executables
        run: |
          .\dist\MooKrata.exe --smoke-test
          .\dist\BooBoo.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: CuteDesktopPet-Windows
          path: CuteDesktopPet-Windows.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Multi-Platform Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-files/
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-files/*.zip \
              --verify-tag --latest --title "Cute Desktop Pet $GITHUB_REF_NAME" \
              --notes-file docs/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
