name: Build and release Cute Desktop Pet

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            cpu: arm64
            arch: Apple-Silicon
          - runner: macos-15-intel
            cpu: x86_64
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pyinstaller==6.22.3' 'Pillow>=10,<13'
      - name: Test source and architecture
        run: |
          test "$(uname -m)" = "${{ matrix.cpu }}"
          python3 -m unittest discover -s tests -q
      - name: Build desktop app
        run: sh scripts/build_macos.sh
      - name: Test bundled app and signing
        timeout-minutes: 3
        run: |
          test -x dist/BooBoo.app/Contents/MacOS/BooBoo
          find dist/BooBoo.app -name moo-krata-motion.png -print -quit | grep moo-krata-motion.png
          dist/BooBoo.app/Contents/MacOS/BooBoo --smoke-test
          dist/BooBoo.app/Contents/MacOS/BooBoo --character=mookrata --smoke-test
          codesign --verify --deep --strict dist/BooBoo.app
      - name: Package Mac download
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/BooBoo.app "CuteDesktopPet-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "CuteDesktopPet-macOS-${{ matrix.arch }}.zip"
      - name: Check downloaded app visibly opens
        shell: bash
        run: |
          set -eu
          mkdir -p "${{ runner.temp }}/unpacked"
          ditto -x -k "CuteDesktopPet-macOS-${{ matrix.arch }}.zip" "${{ runner.temp }}/unpacked"
          screencapture -x "${{ runner.temp }}/before.png"
          open -n --stdout "${{ runner.temp }}/booboo.stdout" --stderr "${{ runner.temp }}/booboo.stderr" "${{ runner.temp }}/unpacked/BooBoo.app"
          sleep 5
          cat "${{ runner.temp }}/booboo.stdout" "${{ runner.temp }}/booboo.stderr" || true
          screencapture -x "${{ runner.temp }}/after.png"
          python3 scripts/check_mac_visibility.py "${{ runner.temp }}/before.png" "${{ runner.temp }}/after.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-visibility-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/before.png
            ${{ runner.temp }}/after.png
            ${{ runner.temp }}/booboo.stdout
            ${{ runner.temp }}/booboo.stderr
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: CuteDesktopPet-macOS-${{ matrix.arch }}
          path: CuteDesktopPet-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyinstaller==6.22.3' 'Pillow>=10,<13'
      - name: Test source
        run: python -m unittest discover -s tests -q
      - name: Build both desktop launchers
        run: cmd.exe /c scripts\build_windows.bat
      - name: Test both executables from download
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'CuteDesktopPet-Windows.zip' -DestinationPath 'unpacked'
          foreach ($name in @('BooBoo', 'MooKrata')) {
            $exe = (Resolve-Path "./unpacked/$name.exe").Path
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force
              throw "$name.exe did not finish its smoke test"
            }
            if ($process.ExitCode -ne 0) { throw "$name.exe exited $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CuteDesktopPet-Windows
          path: CuteDesktopPet-Windows.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish desktop downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CuteDesktopPet-*
          path: release-files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls release-files/*.zip
          gh release create "$GITHUB_REF_NAME" release-files/*.zip \
            --verify-tag --latest --title "Cute Desktop Pet $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md --repo "$GITHUB_REPOSITORY"
