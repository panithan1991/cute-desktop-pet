name: Check BooBoo visibility on macOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mac-visibility.yml'
      - 'scripts/build_macos.sh'
      - 'scripts/check_mac_visibility.py'
      - 'desktop_pet.py'
      - 'window_style.py'
      - 'booboo_art.py'
      - 'assets/booboo-sprites.png'
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple-Silicon
          - runner: macos-15-intel
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pyinstaller==6.22.3' 'Pillow>=10,<13'
      - run: sh scripts/build_macos.sh
      - name: Reproduce download and visible launch
        shell: bash
        run: |
          set -eu
          ditto -c -k --sequesterRsrc --keepParent dist/BooBoo.app "${{ runner.temp }}/BooBoo.zip"
          mkdir -p "${{ runner.temp }}/unpacked"
          ditto -x -k "${{ runner.temp }}/BooBoo.zip" "${{ runner.temp }}/unpacked"
          screencapture -x "${{ runner.temp }}/before.png"
          open -n --stdout "${{ runner.temp }}/booboo.stdout" --stderr "${{ runner.temp }}/booboo.stderr" "${{ runner.temp }}/unpacked/BooBoo.app"
          sleep 5
          cat "${{ runner.temp }}/booboo.stdout" "${{ runner.temp }}/booboo.stderr" || true
          pgrep -fl BooBoo || true
          screencapture -x "${{ runner.temp }}/after.png"
          python3 scripts/check_mac_visibility.py "${{ runner.temp }}/before.png" "${{ runner.temp }}/after.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-visibility-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/before.png
            ${{ runner.temp }}/after.png
            ${{ runner.temp }}/booboo.stdout
            ${{ runner.temp }}/booboo.stderr
          if-no-files-found: ignore
